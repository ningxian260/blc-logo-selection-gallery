<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>佛梁 40 週年 Logo 設計方案集</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#202a3e;background:#f6f7fa}*{box-sizing:border-box}body{margin:0}header{background:#172d4d;color:white;padding:48px max(24px,calc((100vw - 1250px)/2)) 40px}header small{letter-spacing:.12em;color:#c7d7e7}h1{font-size:clamp(28px,5vw,45px);margin:12px 0}header p{color:#dce5ee;line-height:1.8;margin:0;max-width:800px}main{max-width:1300px;margin:auto;padding:28px 24px 80px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#f6f7faf5;padding:12px 0;z-index:2}.bar button,.action{border:1px solid #cbd4df;background:white;color:#283d58;border-radius:9px;padding:10px 15px;cursor:pointer;font-size:15px}.bar button.active,.action{background:#223f60;color:white;border-color:#223f60}.count{margin-left:auto;color:#5a697a}.notice{background:#edf3f8;border-left:4px solid #7798b8;padding:16px 18px;line-height:1.7;margin:15px 0 25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}.card{background:white;border:1px solid #e1e6ec;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #1b2c4010}.pic{display:block;width:100%;height:230px;object-fit:contain;background:#f0f2f5;cursor:zoom-in}.info{padding:15px}.tag{font-size:12px;color:#677990}.info h3{margin:7px 0 14px;font-size:17px}.row{display:flex;gap:8px}.row button{flex:1;border:1px solid #cbd4df;border-radius:8px;padding:9px;background:white;cursor:pointer}.row button.selected{color:#a0433d;background:#fff1ef;border-color:#e7b9b3}dialog{border:0;border-radius:14px;padding:15px;max-width:min(95vw,1200px);max-height:95vh}dialog::backdrop{background:#101a2bdc}dialog img{display:block;max-width:100%;max-height:78vh;margin:auto}dialog button{float:right;margin-bottom:8px;padding:8px 14px}footer{color:#66788b;margin-top:45px;line-height:1.8}@media(max-width:600px){header{padding:34px 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pic{height:145px}.info{padding:10px}.info h3{font-size:14px}.row{flex-direction:column}.count{width:100%;margin:0}}
</style></head><body><header><small>HHCKLA BUDDHIST LEUNG CHIK WAI COLLEGE</small><h1>佛梁 40 週年 Logo 設計方案集</h1><p>香海正覺蓮社佛教梁植偉中學 · 方案瀏覽與挑選<br>瀏覽設計，按「加入心水」保存喜歡的方案，再複製編號與同事分享。</p></header><main><div class="notice">點擊圖片可放大；部分圖片包含多個構思，回覆時可補充圖片中的位置。這些圖片為 AI 生成的概念展示，文字和細節仍需核對及完善。</div><div class="bar"><button class="active" data-filter="全部">全部</button><button data-filter="心水">♥ 我的心水</button><button class="action" id="copy">複製心水編號</button><span class="count" id="count"></span></div><div class="grid" id="grid"></div><footer>心水只儲存在目前瀏覽器，不會自動提交。請複製編號，透過慣用方式回覆負責老師。</footer></main><dialog id="viewer"><button id="close">關閉 ✕</button><div style="clear:both"></div><img id="large" alt=""><p id="caption"></p></dialog><script>
let data=[],filter='全部';let chosen=new Set(JSON.parse(localStorage.getItem('blc-logo-picks')||'[]'));const grid=document.querySelector('#grid');function render(){let list=data.filter(x=>filter==='全部'||(filter==='心水'?chosen.has(x.id):x.cat===filter));document.querySelector('#count').textContent=`顯示 ${list.length} 張 · 已選 ${chosen.size} 張`;grid.innerHTML='';for(const x of list){let c=document.createElement('article');c.className='card';let img=document.createElement('img');img.className='pic';img.src=x.img;img.alt=x.id+' '+x.title;img.loading='lazy';img.onclick=()=>{document.querySelector('#large').src=x.img;document.querySelector('#large').alt=img.alt;document.querySelector('#caption').textContent=x.id+' · '+x.title;document.querySelector('#viewer').showModal()};let info=document.createElement('div');info.className='info';let tag=document.createElement('div');tag.className='tag';tag.textContent=x.cat+' / '+x.id;let h=document.createElement('h3');h.textContent=x.title;let row=document.createElement('div');row.className='row';let b=document.createElement('button');b.textContent=chosen.has(x.id)?'♥ 已加入心水':'♡ 加入心水';b.className=chosen.has(x.id)?'selected':'';b.onclick=()=>{chosen.has(x.id)?chosen.delete(x.id):chosen.add(x.id);localStorage.setItem('blc-logo-picks',JSON.stringify([...chosen]));render()};let v=document.createElement('button');v.textContent='放大查看';v.onclick=img.onclick;row.append(b,v);info.append(tag,h,row);c.append(img,info);grid.append(c)}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(a=>a.classList.toggle('active',a===b));render()});document.querySelector('#close').onclick=()=>document.querySelector('#viewer').close();document.querySelector('#copy').onclick=async()=>{let text=chosen.size?'我喜歡的佛梁 Logo 方案：'+[...chosen].sort().join('、'):'請先加入心水方案';if(!chosen.size){alert(text);return}try{await navigator.clipboard.writeText(text);alert('已複製：'+text)}catch{prompt('請複製以下內容：',text)}};fetch('data.json?v=20261029-44').then(r=>r.json()).then(x=>{data=x;chosen=new Set([...chosen].filter(id=>data.some(item=>item.id===id)));localStorage.setItem('blc-logo-picks',JSON.stringify([...chosen]));render()});
</script></body></html>
